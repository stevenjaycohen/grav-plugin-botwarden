form:
  validation: loose
  fields:
    whitelist:
      type: textarea
      validate:
        type: textarea
        pattern: '\A(?:[ \t]*(?:\#[^\r\n]*|(?:[0-9]{1,3}\.){3}[0-9]{1,3}(?:/0*(?:[0-9]|[12][0-9]|3[0-2]))?|[0-9a-fA-F:.]*:[0-9a-fA-F:.]*(?:/0*(?:[0-9]|[1-9][0-9]|1[01][0-9]|12[0-8]))?)?[ \t]*(?:\r\n|\r|\n|\z))*\z'
        message: Enter one IP or CIDR per line with an IPv4 prefix 0–32 or IPv6 prefix 0–128.
    trusted_proxies:
      type: textarea
      validate:
        type: textarea
        pattern: '\A(?:[ \t]*(?:\#[^\r\n]*|(?:[0-9]{1,3}\.){3}[0-9]{1,3}(?:/0*(?:[0-9]|[12][0-9]|3[0-2]))?|[0-9a-fA-F:.]*:[0-9a-fA-F:.]*(?:/0*(?:[0-9]|[1-9][0-9]|1[01][0-9]|12[0-8]))?)?[ \t]*(?:\r\n|\r|\n|\z))*\z'
        message: Enter one IP or CIDR per line with an IPv4 prefix 0–32 or IPv6 prefix 0–128.
