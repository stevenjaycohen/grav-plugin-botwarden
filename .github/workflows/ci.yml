name: PHP lint and unit tests
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sqlite3, curl, mbstring
          tools: composer:v2
          coverage: none
      - name: PHP syntax checks
        run: find . -path './vendor' -prune -o -name '*.php' -print0 | xargs -0 -r -n1 php -d display_errors=1 -l
      - name: Validate Composer
        run: composer validate --no-check-publish
      - name: Install test dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Run PHPUnit with diagnostics
        run: php -d display_errors=1 -d error_reporting=-1 vendor/bin/phpunit --testdox
